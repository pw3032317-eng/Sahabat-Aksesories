<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>SAHABAT ACC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#0e1726;--mu:#5b6678;--bd:#dde3ee;--bl:#1f6feb;--bl2:#0b3d91;--or:#ff8a1f;--gr:#16a34a;--rd:#dc2626;--yl:#d99a00;--sb:#0a0f1c;--sh:0 1px 3px rgba(10,15,28,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1120;--card:#121a2e;--tx:#e7ecf6;--mu:#93a0b8;--bd:#22304d;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1120;--card:#121a2e;--tx:#e7ecf6;--mu:#93a0b8;--bd:#22304d;--sh:none;color-scheme:dark}
*,*:before,*:after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-weight:600}
.btn.pri{background:var(--bl);border-color:var(--bl);color:#fff}
.btn.pri:hover{background:var(--bl2)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.6;cursor:wait}
input.in{width:100%;min-height:44px;padding:0 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--or);z-index:99;transition:width .3s}
#off{display:none;background:var(--rd);color:#fff;text-align:center;padding:6px;font-weight:600}
/* login */
.lg{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#050912,#0b3d91)}
.lgc{width:100%;max-width:400px;background:var(--card);border-radius:18px;padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:12px}
.logo i{width:44px;height:44px;border-radius:12px;background:var(--or);display:grid;place-items:center;font-style:normal;font-size:22px}
.logo b{font-size:20px;letter-spacing:.5px;display:block;line-height:1.1}
.logo small{color:var(--mu)}
.fld{margin-top:16px}
.fld label{display:block;font-weight:600;margin-bottom:6px}
.pw{position:relative}
.pw button{position:absolute;right:4px;top:0;height:44px;width:48px;border:0;background:none}
.err{margin-top:14px;padding:10px 12px;border-radius:10px;background:rgba(220,38,38,.12);color:var(--rd);font-weight:500}
.hint{margin-top:16px;color:var(--mu);font-size:12.5px}
/* shell */
.sb{position:fixed;inset:0 auto 0 0;width:232px;background:var(--sb);color:#cdd6e8;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 14px;display:flex;flex-direction:column;z-index:40;transition:transform .25s;overflow-y:auto}
.sb .logo{padding:6px 8px 18px;color:#fff}
.sb .logo small{color:#8a97b3}
.sb a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:inherit;text-decoration:none;font-weight:500}
.sb a:hover{background:#151d33}
.sb a.on{background:var(--bl);color:#fff}
.sb a span.k{margin-left:auto;font-size:11px;opacity:.55}
.mn{margin-left:232px;min-height:100vh;display:flex;flex-direction:column}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
.tb h1{font-size:18px;margin:0;white-space:nowrap}
.hb{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-size:20px}
.sr{position:relative;flex:1;max-width:460px;margin:0 auto}
#dd{position:absolute;left:0;right:0;top:50px;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);display:none;overflow:hidden}
#dd .it{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;padding:10px 14px;border:0;border-bottom:1px solid var(--bd);background:none;text-align:left;min-height:44px}
#dd .it:hover{background:var(--bg)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-gr{background:rgba(22,163,74,.15);color:var(--gr)}.b-yl{background:rgba(217,154,0,.18);color:var(--yl)}.b-rd{background:rgba(220,38,38,.15);color:var(--rd)}.b-bl{background:rgba(31,111,235,.15);color:var(--bl)}.b-or{background:rgba(255,138,31,.18);color:#c25e00}
.usr{display:flex;align-items:center;gap:10px;margin-left:auto;white-space:nowrap}
.usr small{display:block;color:var(--mu);line-height:1.1}
.ct{flex:1;padding:20px}
.ft{padding:14px 20px;color:var(--mu);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;border-top:1px solid var(--bd)}
.bn{display:none}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.card h3{margin:0 0 10px;font-size:15px}
.kpi{border:1px solid var(--bd);border-left:4px solid var(--bl);text-align:left;width:100%}
.kpi .l{color:var(--mu);font-weight:500}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px}
.kpi.o{border-left-color:var(--or)}.kpi.g{border-left-color:var(--gr)}.kpi.r{border-left-color:var(--rd)}.kpi.y{border-left-color:var(--yl)}
.two{display:grid;gap:14px;grid-template-columns:3fr 2fr;margin-top:14px}
.chart{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mu)}
.chart i{display:block;width:100%;max-width:46px;background:var(--bl);border-radius:6px 6px 0 0;min-height:3px}
.chart div:last-child i{background:var(--or)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
td.n,th.n{text-align:right}
.ph{text-align:center;padding:48px 16px}
.ph .e{font-size:44px}
#toasts{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:100;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{padding:12px 16px;border-radius:12px;background:var(--sb);color:#fff;border-left:5px solid var(--bl);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.err{border-color:var(--rd)}.toast.ok{border-color:var(--gr)}.toast.warn{border-color:var(--yl)}
.ov{position:fixed;inset:0;background:rgba(5,9,18,.6);display:grid;place-items:center;z-index:90;padding:16px}
.dlg{background:var(--card);border-radius:16px;padding:22px;max-width:380px;width:100%}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card)}.chip.on{background:var(--bl);color:#fff;border-color:var(--bl)}
.pg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-top:14px}
.pc{text-align:left;padding:14px;border:1px solid var(--bd);border-radius:14px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.pc:hover{border-color:var(--bl)}.pc .pr{font-size:20px;font-weight:800;color:var(--bl)}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.fg label{font-weight:600;font-size:13px;display:block;margin-bottom:4px}
select.in{width:100%;min-height:44px;padding:0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.dlg.w{max-width:520px;max-height:90vh;overflow:auto}
th.s{cursor:pointer}
.dd{position:absolute;left:0;right:0;top:50px;z-index:20;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);display:none;overflow:hidden}
.dd .it{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;padding:10px 14px;border:0;border-bottom:1px solid var(--bd);background:none;text-align:left;min-height:44px}
.dd .it:hover{background:var(--bg)}
.rc{font:12px/1.45 ui-monospace,Menlo,monospace;color:#000;background:#fff;padding:10px;border-radius:8px}
.rc hr{border:0;border-top:1px dashed #000;margin:6px 0}
#pa{display:none}
@media print{#root,#toasts,#bar,#off,.ov{display:none!important}#pa{display:block!important}#pa .rc{padding:0}#pa.r58{width:58mm}#pa.r80{width:80mm}#pa.ra5 .rc{font-size:14px}}
.pgb{height:10px;border-radius:99px;background:var(--bd);overflow:hidden;margin-top:12px}.pgb i{display:block;height:100%;width:0;background:var(--or);transition:width .3s}
#pa.rrep{width:auto;color:#000;background:#fff;font:12px Inter,sans-serif}#pa.rrep table{width:100%;border-collapse:collapse}#pa.rrep th,#pa.rrep td{border-bottom:1px solid #999;padding:4px}
.lgi{height:44px;width:44px;border-radius:10px;display:block;flex:none}
.lgc .lgi{height:60px;width:60px}
.rl{display:block;margin:0 auto 6px;width:28%;max-width:84px;height:auto}
@media print{#pa .rl{filter:grayscale(1) contrast(1.5)}#pa.ra5 .rl{max-width:110px}}
.lgi{border-radius:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.lgc .lgi{height:72px;width:72px}
.sb .lgi{height:48px;width:48px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--bl)}
td.ck,th.ck{width:48px;padding:6px 10px;cursor:pointer;text-align:center}
tr.pr{cursor:pointer}tr.pr:hover{background:var(--bg)}
.selbar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:36;align-items:center;gap:10px;background:var(--sb);color:#fff;padding:10px 14px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);white-space:nowrap}
.selbar .btn{min-height:40px}
@media (max-width:900px){.selbar{bottom:calc(66px + env(safe-area-inset-bottom,0px))}}
.cbar,.cbsp{display:none}
@media (max-width:700px){
#cart table,#cart tbody,#cart tr,#cart td{display:block;width:100%}
#cart thead{display:none}
#cart tr{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
#cart td{border:0;padding:0;white-space:normal}
#cart td::before{content:attr(data-l);display:block;font-size:11px;color:var(--mu)}
#cart td:nth-child(1){display:none}
#cart td:nth-child(2){grid-column:1/-1;font-weight:700}
#cart td:nth-child(2)::before{display:none}
#cart td input,#cart td select{width:100%!important}
}
@media (max-width:900px){
.cbar{display:flex;position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:34;background:var(--card);border-top:1px solid var(--bd);padding:8px 12px;justify-content:space-between;align-items:center;gap:12px}
.cbar .btn{flex:1;max-width:240px}.cbar b{font-size:18px}.cbsp{display:block;height:76px}
}
@media (max-width:900px){
.sb{transform:translateX(-100%)}.sb.open{transform:none}
.mn{margin-left:0;padding-bottom:64px}.hb{display:block}
.tb{padding:8px 12px;flex-wrap:wrap}.tb h1{font-size:16px}.sr{order:5;flex:1 1 100%;max-width:none}.usr small{display:none}
.ct{padding:14px}.two{grid-template-columns:1fr}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);z-index:35;padding-bottom:env(safe-area-inset-bottom,0px)}
.bn button{flex:1;min-height:56px;border:0;background:none;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bn button.on{color:var(--bl);font-weight:700}
.bn button span{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.sb,.tb,.ft,.bn{display:none!important}.mn{margin:0}}
</style>
</head>

function toast(msg, type = "", ms = 3500, retry, label){
  const t = document.createElement("div");
  t.className = "toast " + type; t.textContent = msg;
  if (retry){
    const b = document.createElement("button"); b.className = "btn"; b.textContent = label || "Coba lagi"; b.style.cssText = "margin-left:12px;min-height:36px;color:#0e1726";
    b.onclick = () => { t.remove(); retry(); }; t.appendChild(b);
  }
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), ms);
}
function confirmDlg(msg, okText = "Ya, lanjutkan"){
  return new Promise(res => {
    const o = document.createElement("div"); o.className = "ov";
    o.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><p style="margin:0;font-weight:600">${esc(msg)}</p><div class="row"><button class="btn" data-v="0">Batal</button><button class="btn pri" data-v="1">${esc(okText)}</button></div></div>`;
    o.onclick = e => { const b = e.target.closest("button"); if (b || e.target === o){ o.remove(); res(!!b && b.dataset.v === "1"); } };
    document.body.appendChild(o); $("button.pri", o).focus();
  });
}

function cleanP(d, old){

  return {kode:t("kode"), nama:t("nama"), kategori:t("kategori"), tipe:t("tipe"), hpp: S && S.role === "owner" ? num(d.hpp) : (old ? old.hpp : 0),

function upsertP(d){
  if (!String(d.nama || "").trim()) throw new Error("Nama produk wajib diisi");
  if (!(Number(d.harga) > 0)) throw new Error("Harga jual harus lebih dari 0");
  const old = DEMO_P.find(p => p.kode === String(d.kode || "").trim()), p = cleanP(d, old);
  if (old){ Object.assign(old, p); return old; }
  if (!p.kode) p.kode = String(Math.max(1000000, ...DEMO_P.map(x => +x.kode)) + 1);
  DEMO_P.push(p); return p;
}
const DEMO_PUR = [], DEMO_EXP = [], RID = {}; let expSeq = 0;
function nextNo(L, tgl){
  const pre = tgl.slice(2).replace(/-/g, "");
  return pre + String(Math.max(0, ...L.filter(x => x.no.startsWith(pre)).map(x => +x.no.slice(6))) + 1).padStart(4, "0");
}
/* Satu fungsi untuk penjualan dan pembelian; server menghitung ulang semua angka */
function demoTx(kind, d){
  const L = kind === "sales" ? DEMO_S : DEMO_PUR, party = kind === "sales" ? "konsumen" : "supplier";
  if (d.requestId && RID[d.requestId]) return RID[d.requestId];
  if (!Array.isArray(d.items) || !d.items.length) throw new Error("Keranjang kosong");
  if (d.updateHpp && S.role !== "owner") throw new Error("Hanya owner yang boleh memperbarui HPP");
  const tgl = /^\d{4}-\d{2}-\d{2}$/.test(d.tgl) ? d.tgl : isoD(new Date()), need = {};
  const items = d.items.map(it => {
    const p = DEMO_P.find(x => x.kode === it.kode); if (!p) throw new Error("Produk " + it.kode + " tidak ditemukan");
    const qty = Math.floor(Number(it.qty)); if (!(qty > 0)) throw new Error("Qty tidak valid untuk " + p.nama);
    const harga = num(it.harga), gross = harga * qty, dr = Math.min(gross, num(it.diskon_rp) + gross * Math.min(100, num(it.diskon_persen)) / 100);
    need[p.kode] = (need[p.kode] || 0) + qty;
    return {kode:p.kode, nama:p.nama, harga, qty, satuan:p.satuan || "Pcs", diskon_rp:Math.round(dr), subtotal:Math.round(gross - dr), cost:p.hpp};
  });
  if (kind === "sales") for (const k in need){ const p = DEMO_P.find(x => x.kode === k); if (!p.jasa && p.stok < need[k]) throw new Error("Stok " + p.nama + " tidak cukup (sisa " + p.stok + ")"); }
  const subtotal = items.reduce((a, i) => a + i.subtotal, 0), diskon = Math.min(subtotal, Math.round(subtotal * Math.min(100, num(d.diskon_persen)) / 100 + num(d.diskon_rp)));

let S = null; // sesi: {token,user,role,perms}
async function api(action, data = {}){
  loading(true);
  try {
    if (DEMO) return await demoApi(action, data);
    const read = /^(get|report|dashboard)/.test(action), max = read ? 2 : 0;
    for (let t = 0; ; t++){
      const ac = new AbortController(), to = setTimeout(() => ac.abort(), 25000);
      try {
        const res = await fetch(CFG.GAS_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action, token:S && S.token, data}), signal:ac.signal});
        let j; try { j = await res.json(); } catch(e){ const x = new Error("URL Web App salah atau belum di-deploy untuk Anyone"); x.fatal = true; throw x; }
        if (!j.ok){
          const x = new Error(j.error || "Terjadi kesalahan"); x.fatal = true;
          if (/token|sesi/i.test(x.message) && action !== "login"){ expire(); }
          throw x;
        }
        return j.data;
      } catch(e){
        if (e.fatal) throw e;
        if (t >= max){ const x = new Error(e.name === "AbortError" ? "Waktu habis, periksa koneksi Anda." : "Tidak dapat terhubung ke server. Periksa koneksi internet Anda."); x.net = true; throw x; }
        await wait(600);
      } finally { clearTimeout(to); }
    }
  } finally { loading(false); }
}

const fv = k => $("#f_" + k);
function nextKode(){ return String(Math.max(1000000, ...cache.map(x => +x.kode || 0)) + 1); }
function fillForm(p){
  CUR = p ? p.kode : "";
  PF.forEach(([k]) => { const e = fv(k); if (e) e.value = p ? (p[k] ?? "") : ""; });
  fv("jasa").value = p && p.jasa ? "1" : "0";

function calc(from){

  const w = norm(PT.q).split(" ").filter(Boolean);
  const r = cache.filter(p => w.every(x => norm(p.kode + " " + p.nama + " " + p.kategori).includes(x)));
  r.sort((a, b) => (a[PT.s] > b[PT.s] ? 1 : a[PT.s] < b[PT.s] ? -1 : 0) * PT.d);
  const pages = Math.max(1, Math.ceil(r.length / 15)); PT.p = Math.min(PT.p, pages);
  const cols = [["kode","Kode"],["nama","Produk"],["kategori","Kategori"], ...(isOwner() ? [["hpp","HPP"]] : []), ["harga","Harga"],["stok","Stok"]];

    + r.slice((PT.p - 1) * 15, PT.p * 15).map(p => `<tr><td>${esc(p.kode)}</td><td>${esc(p.nama)}</td><td>${esc(p.kategori)}</td>${isOwner() ? `<td class="n">${rp(p.hpp)}</td>` : ""}<td class="n">${rp(p.harga)}</td><td class="n">${p.jasa ? "Jasa" : p.stok}</td><td><button class="btn" data-e="${esc(p.kode)}">Ganti</button> <button class="btn" data-a="${esc(p.kode)}">Stok</button></td></tr>`).join("") + `</tbody></table>`;

function parseCSV(t){
  return t.split(/\r?\n/).filter(l => l.trim()).map(l => { const c = []; let s = "", q = false;
    for (const ch of l){ if (ch === '"') q = !q; else if (ch === "," && !q){ c.push(s); s = ""; } else s += ch; } c.push(s); return c; });
}
async function importCSV(file){
  const rows = parseCSV(await file.text());
  if (rows.length && rows[0][0].trim().toLowerCase() === "kode") rows.shift();
  const objs = rows.map(r => Object.fromEntries(PCOLS.map((c, i) => [c, (r[i] ?? "").trim()])));
  let ok = 0; const bad = [];
  for (let i = 0; i < objs.length; i += 500){
    const r = await act("importProducts", {rows:objs.slice(i, i + 500), offset:i}); if (!r) break;
    ok += r.ok; bad.push(...r.gagal);
  }
  await loadProducts(true); renderProduct();
  await confirmDlg(`Impor selesai: ${ok} berhasil, ${bad.length} gagal.` + bad.slice(0, 5).map(b => ` Baris ${b.baris}: ${b.error}.`).join(""), "Tutup");
}

  if (t === "expense") return {cols:[["Nomor","t"],["Tanggal","t"],["Kategori","t"],["Keterangan","t"],["Jumlah","r"]], rows:r.rows.map(x => [x.nomor, fmtD(x.tgl), x.kategori, x.keterangan, x.jumlah]), foot:["Total", "", "", "", sumBy(r.rows, "jumlah")]};
  if (t === "profit"){ const k = r.penjualan - r.hpp; return {cols:[["Keterangan","t"],["Jumlah","r"]], rows:[["Penjualan", r.penjualan], ["HPP barang terjual", -r.hpp], ["Laba kotor", k], ["Biaya operasional", -r.biaya], ["Laba bersih", k - r.biaya]]}; }
  return {cols:[["Kode","t"],["Barang","t"],["Stok","n"],["HPP","r"],["Nilai","r"]], rows:r.rows.map(x => [x.kode, x.nama, x.stok, x.hpp, x.nilai]), foot:["Total", "", sumBy(r.rows, "stok"), "", sumBy(r.rows, "nilai")]};
}
function tableHtml(R){
  const f = (v, t) => v === "" ? "" : t === "r" ? rp(v) : t === "n" ? v : esc(v), al = i => R.cols[i][1] !== "t" ? "n" : "";
  return `<table><thead><tr>${R.cols.map((c, i) => `<th class="${al(i)}">${esc(c[0])}</th>`).join("")}</tr></thead><tbody>`
    + (R.rows.map(r => `<tr>${r.map((v, i) => `<td class="${al(i)}">${f(v, R.cols[i][1])}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${R.cols.length}" style="color:var(--mu)">Tidak ada data pada rentang ini</td></tr>`)
    + `</tbody>${R.foot ? `<tfoot><tr>${R.foot.map((v, i) => `<th class="${al(i)}">${f(v, R.cols[i][1])}</th>`).join("")}</tr></tfoot>` : ""}</table>`;
}
function saveCSV(name, R){
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const csv = [R.cols.map(c => q(c[0])).join(",")].concat(R.rows.map(r => r.map(q).join(","))).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = name; a.click();
}
function printHtml(html){
  let a = $("#pa");
  if (!a){ a = document.createElement("div"); a.id = "pa"; document.body.appendChild(a); const st = document.createElement("style"); st.id = "pgs"; document.head.appendChild(st); }
  $("#pgs").textContent = "@page{size:A4;margin:12mm}"; a.className = "rrep"; a.innerHTML = html; setTimeout(() => window.print(), 50);
}
function renderReport(){
  const tabs = RT.filter(([k]) => isOwner() || !["profit", "stock"].includes(k)); if (!tabs.some(t => t[0] === RC)) RC = "sales";
  const [d0, d1] = rangeOf("month");
  $("#ct").innerHTML = `<div id="rw"><div class="chips" style="margin:0 0 14px">${tabs.map(([k, l]) => `<button class="chip${k === RC ? " on" : ""}" data-t="${k}">${l}</button>`).join("")}</div>
    <div class="card"><div class="row" style="margin-top:0">${[["today", "Hari ini"], ["week", "Minggu ini"], ["month", "Bulan ini"]].map(([k, l]) => `<button class="chip" data-r="${k}">${l}</button>`).join("")}</div>
    <div class="fg" style="margin-top:10px;align-items:end"><div><label>Dari</label><input class="in" type="date" id="r_d" value="${d0}"></div><div><label>Sampai</label><input class="in" type="date" id="r_a" value="${d1}"></div><div><button class="btn pri" id="r_go" style="width:100%">Tampilkan</button></div></div></div>
    <div class="card" style="margin-top:14px"><div class="row" style="margin-top:0"><button class="btn" id="r_csv">Ekspor CSV</button><button class="btn" id="r_pr">Cetak / PDF</button></div><div class="tw" id="r_out" style="margin-top:12px"></div><div class="tw" id="r_sum" style="margin-top:16px"></div></div></div>`;
  const run = async () => {
    const dari = $("#r_d").value, sampai = $("#r_a").value; if (dari > sampai) return toast("Tanggal awal melebihi tanggal akhir", "warn");
    const r = await act(RA[RC], {dari, sampai}); if (!r) return;
    RD = buildReport(RC, r); RD.title = RT.find(t => t[0] === RC)[1]; RD.per = RC === "stock" ? "Posisi stok saat ini" : "Periode " + fmtD(dari) + " s/d " + fmtD(sampai);
    $("#r_out").innerHTML = tableHtml(RD); $("#r_sum").innerHTML = RD.sum ? tableHtml(RD.sum) : "";
  };
  $("#rw").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.t){ RC = b.dataset.t; return renderReport(); }
    if (b.dataset.r){ const [a, z] = rangeOf(b.dataset.r); $("#r_d").value = a; $("#r_a").value = z; return run(); }
    if (b.id === "r_go") run();
    if (b.id === "r_csv"){ if (RD) saveCSV("laporan-" + RC + ".csv", RD); else toast("Tampilkan laporan dulu", "warn"); }
    if (b.id === "r_pr"){ if (RD) printHtml(`<img src="${LOGO}" alt="" style="height:56px;width:56px;display:block;margin-bottom:6px"><h2>SAHABAT Accessories &amp; Service</h2><h3>Laporan ${esc(RD.title)}</h3><p>${esc(RD.per)}</p>` + tableHtml(RD) + (RD.sum ? "<br>" + tableHtml(RD.sum) : "")); else toast("Tampilkan laporan dulu", "warn"); }
  };
  run();
}

/* ===== Utilitas ===== */
async function renderUtility(){
  $("#ct").innerHTML = `<div class="card"><h3>Backup data</h3><p style="color:var(--mu)">Menyalin seluruh data ke Google Drive${DEMO ? " (mode demo: disimpan di memori)" : ""}.</p><div class="pgb" id="bp" style="display:none"><i></i></div>
    <div class="row"><button class="btn pri" id="bk">Backup sekarang</button><button class="btn" id="bo">Hapus backup lama (simpan 10)</button></div><p id="bm"></p></div>
    <div class="card" style="margin-top:14px"><h3>10 backup terakhir</h3><div class="tw" id="bl"></div></div>`;
  const list = async () => {
    const L = (await act("listBackups", {})) || [];
    $("#bl").innerHTML = `<table><thead><tr><th>Nama file</th><th>Waktu</th><th class="n">Ukuran</th><th></th></tr></thead><tbody>` + (L.map(b => `<tr><td>${esc(b.nama)}</td><td>${new Date(b.waktu).toLocaleString("id-ID")}</td><td class="n">${Math.max(1, Math.round(b.ukuran / 1024))} KB</td><td>${/^https:\/\//.test(b.url || "") ? `<a href="${esc(b.url)}" target="_blank" rel="noopener">Buka</a> ` : ""}<button class="btn" data-r="${esc(b.id)}">Restore</button></td></tr>`).join("") || `<tr><td colspan="4" style="color:var(--mu)">Belum ada backup</td></tr>`) + `</tbody></table>`;
    return L;
  };
  let L = await list();
  $("#bk").onclick = async ev => {
    const b = ev.currentTarget, bar = $("#bp"), i = $("i", bar); b.disabled = true; bar.style.display = "block"; let w = 5; i.style.width = w + "%";
    const iv = setInterval(() => { w = Math.min(90, w + 8); i.style.width = w + "%"; }, 400);
    const r = await act("backup", {}); clearInterval(iv); b.disabled = false; i.style.width = r ? "100%" : "0";
    if (r){ $("#bm").innerHTML = "Backup selesai: <b>" + esc(r.nama) + "</b>" + (/^https:\/\//.test(r.url || "") ? ` <a href="${esc(r.url)}" target="_blank" rel="noopener">Buka file</a>` : ""); toast("Backup selesai", "ok"); L = await list(); }
  };
  $("#bo").onclick = async () => { if (await confirmDlg("Hapus backup lama dan simpan 10 terbaru?", "Hapus") ) { const n = await act("deleteOldBackups", {}); if (n !== null){ toast(n + " backup lama dihapus", "ok"); L = await list(); } } };
  $("#bl").onclick = async e => {
    const x = e.target.closest("[data-r]"); if (!x) return; const b = L.find(y => y.id === x.dataset.r); if (!b) return;
    const ok1 = await confirmDlg(`Pratinjau ${b.nama}: ${b.produk} produk, ${b.nota_jual} nota jual, ${b.nota_beli} nota beli, ${b.biaya} biaya. Data saat ini akan ditimpa; backup otomatis dibuat lebih dulu. Lanjutkan?`, "Lanjut"); if (!ok1) return;
    const v = await formDlg("Ketik RESTORE untuk memastikan", [{id:"k", l:"Konfirmasi"}], "Restore"); if (!v) return;
    if (v.k !== "RESTORE") return toast("Ketikan tidak cocok, restore dibatalkan", "warn");
    if (await act("restore", {id:b.id, konfirmasi:v.k}, "Restore selesai")){ await loadProducts(true); L = await list(); }
  };
}

/* ===== Akun ===== */
function userDlg(u){
  const ids = MENUS.filter(m => !["dashboard", "utility", "account"].includes(m[0]));
  return new Promise(res => {
    const o = document.createElement("div"); o.className = "ov";
    o.innerHTML = `<div class="dlg w"><h3 style="margin:0 0 12px">${u ? "Ubah akun" : "Tambah akun"}</h3>
      <div class="fld"><label>Username</label><input class="in" id="u_n" value="${esc(u ? u.username : "")}" ${u ? "readonly" : ""} autocomplete="off"></div>
      ${u ? "" : `<div class="fld"><label>Password (minimal 6 karakter)</label><input class="in" id="u_p" type="password" autocomplete="new-password"></div>`}
      <div class="fld"><label>Role</label><select class="in" id="u_r"><option value="admin">Admin</option><option value="owner">Owner</option></select></div>
      <div class="fld" id="u_m"><label>Menu yang diizinkan</label>${ids.map(m => `<label style="display:flex;gap:8px;align-items:center;min-height:36px;font-weight:400"><input type="checkbox" value="${m[0]}" ${u && Array.isArray(u.perms) && u.perms.includes(m[0]) ? "checked" : ""}>${esc(m[1])}</label>`).join("")}</div>
      <label style="display:flex;gap:8px;align-items:center;min-height:44px;margin-top:8px"><input type="checkbox" id="u_a" ${!u || u.aktif ? "checked" : ""}>Akun aktif</label>
      <div class="row"><button class="btn" data-v="0">Batal</button><button class="btn pri" data-v="1">Simpan</button></div></div>`;
    const r = $("#u_r", o); r.value = u ? u.role : "admin"; const tg = () => $("#u_m", o).style.display = r.value === "owner" ? "none" : "block"; r.onchange = tg; tg();
    o.onclick = e => {
      const b = e.target.closest("button"); if (!b && e.target !== o) return;
      if (!b || b.dataset.v !== "1"){ o.remove(); return res(null); }
      res({username:$("#u_n", o).value.trim(), password:u ? "" : $("#u_p", o).value, role:r.value, perms:[...o.querySelectorAll("#u_m input:checked")].map(i => i.value), aktif:$("#u_a", o).checked}); o.remove();
    };
    document.body.appendChild(o);
  });
}
async function renderAccount(){
  const L = (await act("getUsers", {})) || [], mn = p => (MENUS.find(m => m[0] === p) || [0, p])[1];
  $("#ct").innerHTML = `<div class="card" id="aw"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Daftar akun (${L.length})</h3><button class="btn pri" id="au">Tambah akun</button></div>
    <div class="tw"><table><thead><tr><th>Username</th><th>Role</th><th>Menu</th><th>Status</th><th></th></tr></thead><tbody>${L.map(u => `<tr><td>${esc(u.username)}</td><td><span class="badge ${u.role === "owner" ? "b-or" : "b-bl"}">${u.role === "owner" ? "Owner" : "Admin"}</span></td><td style="white-space:normal">${u.perms === "*" ? "Semua menu" : esc((u.perms || []).map(mn).join(", ") || "Dashboard saja")}</td><td>${u.aktif ? "Aktif" : "Nonaktif"}</td><td><button class="btn" data-e="${esc(u.username)}">Ubah</button> <button class="btn" data-p="${esc(u.username)}">Password</button>${u.username === "owner" ? "" : ` <button class="btn" data-d="${esc(u.username)}">Hapus</button>`}</td></tr>`).join("")}</tbody></table></div></div>`;
  $("#aw").onclick = async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "au" || b.dataset.e){
      const v = await userDlg(b.dataset.e ? L.find(u => u.username === b.dataset.e) : null); if (!v) return;
      if (await act("saveUser", v, "Akun tersimpan")) renderAccount();
    } else if (b.dataset.p){
      const v = await formDlg("Ganti password: " + b.dataset.p, [{id:"p", l:"Password baru (minimal 6 karakter)", t:"password"}], "Ganti password"); if (!v) return;
      await act("saveUser", {username:b.dataset.p, password:v.p, passwordOnly:true}, "Password diganti");
    } else if (b.dataset.d && await confirmDlg("Hapus akun " + b.dataset.d + "?", "Hapus")){
      if (await act("deleteUser", {username:b.dataset.d}, "Akun dihapus")) renderAccount();
    }
  };
}
const PAGES = { dashboard: renderDashboard, search: renderSearch, product: renderProduct, master: renderMaster, sales: () => renderTx("sales"), purchase: () => renderTx("purchase"), expense: renderExpense, report: renderReport, utility: renderUtility, account: renderAccount };

window.selfTest = async function(){
  const r = [], add = (n, k) => { r.push(!!k); console.log((k ? "LULUS  " : "GAGAL  ") + n); };
  add("esc mencegah XSS", esc("<b>\"x\"</b>") === "&lt;b&gt;&quot;x&quot;&lt;/b&gt;");
  add("format rupiah id-ID", /1\.250\.000/.test(rp(1250000)));
  add("format tanggal dd/mm/yyyy", fmtD("2026-11-10") === "10/11/2026");
  add("hitung baris keranjang (10.000 x 3, diskon 10% dan Rp 500 = 26.500)", lineSub({harga:10000, qty:3, dp:10, dr:500}) === 26500);
  add("mode " + (DEMO ? "DEMO" : "ONLINE") + " dan sesi aktif", !!S);
  add("menu Akun dan Utilitas hanya owner", isOwner() || (!can("account") && !can("utility")));
  if (S){
    try { const p = await api("getProducts", {}); add("muat produk (" + p.length + " barang)", Array.isArray(p)); add("HPP tidak dikirim ke non-owner", isOwner() || p.every(x => x.hpp === undefined)); }
    catch(e){ add("muat produk: " + e.message, false); }
    try { const d = await api("dashboard"); add("dashboard (7 hari)", typeof d.sales === "number" && d.week.length === 7); }
    catch(e){ add("dashboard: " + e.message, false); }
  }
  if (!DEMO){
    try { const j = await (await fetch(CFG.GAS_URL)).json(); add("doGet aktif", j.ok === true); }
    catch(e){ add("doGet aktif (periksa URL dan akses Anyone)", false); }
  }
  const ok = r.every(Boolean); toast(ok ? "Pengecekan lulus (" + r.length + ")" : "Ada pengecekan gagal, lihat konsol", ok ? "ok" : "err"); return ok;
};
